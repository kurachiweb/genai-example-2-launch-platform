query ClientCheckout($purchaseId: ID!) {
  checkout(purchaseId: $purchaseId) {
    purchaseId
    kind
    status
    rejectionReason
    clientSecret
    unitPrice {
      amount
      currency
    }
    quantity
    total {
      amount
      currency
    }
    summary {
      itemName
      quantityLabel
      serviceTiming
      additionalNotes
      isSubscription
    }
    acceptUntil
    expiresAt
    consentVersion
    canRestart
  }
}
