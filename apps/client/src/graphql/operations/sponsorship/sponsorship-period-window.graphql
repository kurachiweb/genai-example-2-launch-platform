query ClientSponsorshipPeriodWindow(
  $productId: ID!
  $tier: SponsorshipTier!
  $startsOn: String
) {
  sponsorshipPeriodWindow(
    productId: $productId
    tier: $tier
    startsOn: $startsOn
  ) {
    businessToday
    nextDayStartsAt
    start {
      earliest
      latest
      unavailable {
        from
        to
        reason
      }
    }
    end {
      earliest
      latest
      unavailable {
        from
        to
        reason
      }
    }
  }
}
