query ClientMyProducts($first: Int!, $after: String) {
  myProducts(first: $first, after: $after) {
    nodes {
      handle
      name
      category {
        id
        name
        handle
        systemDefault
      }
      logo {
        id
        objectKey
        fallbackFormat
        width
        height
      }
      hidden
      listed
      latestLaunch {
        id
        number
        launchDate
        kickoffAt
        status
        outcome
        summary {
          label
          inMatch
        }
      }
      plan {
        mode
        currentLaunchDate
        window {
          earliest
          latest
          unavailable {
            from
            to
            reason
          }
          relaunchIntervalDays
        }
        blocks {
          code
          message
          releaseAt
        }
        locked
        locks {
          code
          message
        }
        lockUnknown
        ultrasEntitled
      }
    }
    pageInfo {
      endCursor
      hasNextPage
    }
  }
}
