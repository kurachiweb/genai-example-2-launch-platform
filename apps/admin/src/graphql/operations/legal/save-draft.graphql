mutation AdminSaveLegalDocumentDraft($input: SaveLegalDocumentDraftInput!) {
  saveLegalDocumentDraft(input: $input) {
    kind
    stateVersion
    latestBody
    draft {
      body
      savedAt
      savedBy {
        id
        nickname
      }
    }
    revisions {
      versionNumber
      publishedAt
      changeSummary
      publishedBy {
        id
        nickname
      }
    }
  }
}
