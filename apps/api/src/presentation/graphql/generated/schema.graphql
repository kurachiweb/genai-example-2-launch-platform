"""決済画面と決済後のランディングが表示する購入"""
type Checkout {
  """受付期限。期限の無い購入はnull"""
  acceptUntil: DateTime

  """失効した購入を受付期限の前にやり直せるなら真"""
  canRestart: Boolean!

  """状態がOPENのときだけ値がある"""
  clientSecret: String

  """決済画面が表示する同意の文言の版"""
  consentVersion: String!

  """決済セッションの有効期限"""
  expiresAt: DateTime!
  kind: PurchaseKind!
  purchaseId: ID!
  quantity: Int!

  """状態がREFUNDINGのときだけ値がある"""
  rejectionReason: CheckoutRejectionReason
  status: CheckoutStatus!
  summary: CheckoutSummary!
  total: Money!
  unitPrice: Money!
}

"""権利を付与できなかった理由"""
enum CheckoutRejectionReason {
  """同じ対象の二重の支払い"""
  DUPLICATE

  """購入の条件を満たさない"""
  INELIGIBLE

  """受付期限の後の支払い"""
  LATE
}

"""決済後のランディングの確認の結果"""
type CheckoutReturnResult {
  checkout: Checkout!
}

"""決済の開始の結果。決済を始める変更操作が返す"""
type CheckoutStart {
  """決済画面の経路に使う購入のID"""
  purchaseId: ID!
}

"""決済画面に示す購入の状態"""
enum CheckoutStatus {
  """完了"""
  COMPLETED

  """失効"""
  EXPIRED

  """支払える"""
  OPEN

  """支払いの確認中"""
  PROCESSING

  """権利を付与できず全額返金を依頼した"""
  REFUNDING

  """Stripeに到達できず支払いの準備ができない"""
  UNAVAILABLE
}

"""最終確認画面の表示事項"""
type CheckoutSummary {
  additionalNotes: [String!]!
  isSubscription: Boolean!
  itemName: String!
  quantityLabel: String!
  serviceTiming: String!
}

input CompleteSecondFactorLoginInput {
  challenge: String!
  secondFactor: SecondFactorInput!
}

