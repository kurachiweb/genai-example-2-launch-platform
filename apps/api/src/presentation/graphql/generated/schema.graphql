  width: Int
}

"""
AVIF・WebPに非対応のブラウザ向けの形式。原本がJPEGならJPG、SVGならSVG(SVGはこの形式だけで表示する)、それ以外はPNG
"""
enum MediaImageFallbackFormat {
  JPG
  PNG
  SVG
}

"""利用者側のログインの問い合わせ"""
type MemberInquiry {
  """停止中の利用者では偽"""
  canPost: Boolean!
  category: InquiryCategory!
  createdAt: DateTime!
  id: ID!
  lastMessageAt: DateTime!

  """送信日時の古い順"""
  messages: [InquiryMessage!]!
  status: InquiryStatus!
}

