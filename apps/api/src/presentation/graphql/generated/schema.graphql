type Query {
  """招待中を含む全管理者を登録の新しい順に返す"""
  adminAccounts: [AdminAccount!]!

  """管理画面のログインと未ログインの問い合わせの一覧(50件ずつ、受付日時の新しい順)。閲覧のみ以上"""
  adminInquiries(after: String, filter: AdminInquiryFilterInput): AdminInquiryPage!

  """管理画面の問い合わせの詳細。退会済みも返し、見つからなければnull。閲覧のみ以上"""
  adminInquiry(id: ID!): AdminInquiry

  """紐付く問い合わせの件数付きのカテゴリ。追加の順で、標準カテゴリを末尾に置く。閲覧のみ以上"""
  adminInquiryCategories: [AdminInquiryCategory!]!

  """管理画面の編集の対象の法務文書。閲覧のみ以上の管理者"""
  adminLegalDocument(kind: LegalDocumentKind!): AdminLegalDocument!

  """管理画面で表示する版。存在しない版はnull。閲覧のみ以上の管理者"""
  adminLegalDocumentVersion(kind: LegalDocumentKind!, versionNumber: Int!): AdminLegalDocumentVersion

  """管理画面の法務文書の一覧。閲覧のみ以上の管理者"""
  adminLegalDocuments: [AdminLegalDocumentSummary!]!

  """退会済みを除く「未対応」のログインと未ログインの問い合わせの合計件数。閲覧のみ以上"""
  adminUnhandledInquiryCount: Int!

  """ログイン中の管理者。未ログイン・無効なセッションではnull"""
  adminViewer: AdminViewer

  """監査ログの検索。変更・削除の操作は無い"""
  auditLogs(after: String, filter: AuditLogFilterInput): AuditLogPage!

  """本人の購入の決済画面の表示事項。他人・存在しない購入はcheckout_not_found"""
  checkout(purchaseId: ID!): Checkout!

  """ハンドルの使用可否。自分の現在と保持中の旧ハンドルは使えるものとして扱う"""
  handleAvailability(handle: String!): HandleAvailability!

  """問い合わせフォームのカテゴリの選択肢。追加の順で、標準カテゴリを末尾に置く"""
  inquiryCategories: [InquiryCategory!]!

  """問い合わせフォームに表示する送信者。停止していないログイン中の利用者だけ値を返す"""
  inquiryComposer: InquiryComposer

  """法務文書の最新版と改訂履歴"""
  legalDocument(kind: LegalDocumentKind!): LegalDocument!

  """法務文書の指定した版。存在しない版はnull"""
  legalDocumentVersion(kind: LegalDocumentKind!, versionNumber: Int!): LegalDocumentVersion

  """本人の問い合わせのチャット。本人の問い合わせでなければnull"""
  memberInquiry(id: ID!): MemberInquiry

  """ログイン中の利用者(停止中を含む)をフォローしている、停止中でない利用者を新しい順に返す。firstは1〜20"""
  myFollowers(after: String, first: Int!): FollowEntryConnection!

  """ログイン中の利用者(停止中を含む)がフォローしている、停止中でない利用者を新しい順に返す。firstは1〜20"""
  myFollowing(after: String, first: Int!): FollowEntryConnection!

  """自分のログインの問い合わせの一覧(20件ずつ、送信日時の新しい順)。停止中の利用者も読める"""
  myInquiries(after: String): MemberInquiryPage!

  """他人・論理削除済み・不在はnull(404)。自分のプロダクトの旧ハンドルは転送先を返す"""
  myProduct(handle: String!): MyProductResult

  """ログイン中の利用者(停止中を含む)の論理削除していないプロダクトを最新のローンチ日の新しい順に返す。firstは1〜20"""
  myProducts(after: String, first: Int!): MyProductConnection!

  """ログイン中の利用者(停止中を含む)のプロフィール編集用の情報"""
  myProfile: MyProfile!

  """ログイン中の端末の一覧"""
  mySessions: [UserSessionSummary!]!

  """登録画面で選べるローンチ日"""
  newProductLaunchWindow: LaunchDateWindow!

  """ログイン中の利用者の決済履歴(既定20件・1〜50件、発生時刻の新しい順)"""
  paymentHistory(after: String, first: Int): PaymentRecordConnection!

  """
  プロダクトのハンドルの使用可否。productHandleは編集中のプロダクトの現在のハンドルで、その現在と保持中の旧ハンドルは使えるものとして扱う
  """
  productHandleAvailability(handle: String!, productHandle: String): HandleAvailability!

  """現在のハンドルで本人のプロダクトだけ。それ以外はnull"""
  productOwnerStatus(productHandle: String!): ProductOwnerStatus

  """見つからない・表示できないハンドルではnull(404)。旧ハンドルは転送先を返す"""
  publicProfile(handle: String!): PublicProfileResult

  """APIサーバーの時刻とデータベースへの到達可否"""
  systemStatus: SystemStatus!

  """Ultrasの月額の価格と新規の加入の受付の状態。ログイン不要"""
  ultrasOffer: UltrasOffer!

  """有料プラン導線の機能フラグの現在の値と最後の変更。閲覧のみ以上の管理者"""
  ultrasPromotionSetting: UltrasPromotionSetting!

  """ログイン中の利用者。未ログイン・無効なセッションではnull"""
  viewer: Viewer

  """ログイン中の利用者のUltrasの加入状態と特典の有無。未ログインはnull"""
  viewerUltras: ViewerUltras
}

