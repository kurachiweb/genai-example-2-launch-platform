input MemberInquiryInput {
  body: String!
  categoryId: ID!

  """アップロード済みの問い合わせの添付のファイルのID"""
  fileIds: [ID!]!
}

"""自分の問い合わせの一覧の1ページ"""
type MemberInquiryPage {
  items: [MemberInquirySummary!]!

  """続きが無ければnull"""
  nextCursor: String
}

"""自分の問い合わせの一覧の1行"""
type MemberInquirySummary {
  category: InquiryCategory!
  createdAt: DateTime!
  id: ID!
  lastMessageAt: DateTime!
  status: InquiryStatus!
}

"""金額"""
type Money {
  """最小通貨単位の整数"""
  amount: Int!

  """ISO 4217の小文字の通貨コード"""
  currency: String!
}

type Mutation {
  """メールアドレスとパスワードによるログイン。有効な管理者には必ず第2要素を求める"""
  adminLogin(
    email: String!

    """照合するパスワード"""
    password: String!
  ): AdminSecondFactorRequired!

  """この端末のログアウト"""
  adminLogout: Boolean!

  """パスワードの変更。操作した端末へ新しいセッションを発行する"""
  changeAdminPassword(
    """設定する新しいパスワード"""
    newPassword: String!
    reAuthentication: AdminReAuthenticationInput!
  ): Boolean!

  """ロールの変更"""
  changeAdminRole(id: ID!, reason: String, role: AdminRole!): AdminAccount!

  """対応ステータスの変更。変更後の詳細を返す。モデレーター以上"""
  changeInquiryStatus(inquiryId: ID!, reason: String, status: InquiryStatus!): AdminInquiry!

  """招待の完了の2段階目。認証コードで有効化し、ログインする"""
  completeAdminInvitation(token: String!, totpCode: String!): AdminRecoveryCodeSet!

  """認証コードかリカバリコードによるログインの完了"""
  completeAdminSecondFactorLogin(challenge: String!, secondFactor: AdminSecondFactorInput!): AdminViewer!

  """多要素認証の再設定の完了。操作した端末へ新しいセッションを発行する"""
  completeAdminTotpReset(totpCode: String!): AdminRecoveryCodeSet!

  """認証コードかリカバリコードによるログインの完了"""
  completeSecondFactorLogin(input: CompleteSecondFactorLoginInput!): Viewer!

  """メールアドレス変更の確定"""
  confirmAdminEmailChange(token: String!): AdminConfirmationResult!

  """決済後のランディングでの決済セッションの確認と反映。Stripeに到達できなければ未完了の購入を処理中として返す"""
  confirmCheckoutReturn(sessionId: String!): CheckoutReturnResult!

  """メールアドレス変更の確定"""
  confirmEmailChange(token: String!): ConfirmationResult!

  """パスワード変更の確定"""
  confirmPasswordChange(token: String!): ConfirmationResult!

  """カテゴリの追加。モデレーター以上"""
  createInquiryCategory(name: String!, reason: String): InquiryCategory!

  """
  Customer Portalのセッションの作成。加入したことがある本人のStripe Customerにセッションを作り、移動先のURLを返す。戻り先はプラン管理画面
  """
  createUltrasPortalSession: UltrasPortalSession!

  """管理者の削除"""
  deleteAdmin(id: ID!, reason: String): Boolean!

  """カテゴリの削除。紐付く問い合わせを標準カテゴリへ付け替える。モデレーター以上"""
  deleteInquiryCategory(id: ID!, reason: String): Boolean!

  """多要素認証の無効化"""
  disableTotp(input: ReAuthenticationInput!): Boolean!

  """下書きの破棄。最上位管理者"""
  discardLegalDocumentDraft(input: DiscardLegalDocumentDraftInput!): AdminLegalDocument!

  """多要素認証の有効化"""
  enableTotp(totpCode: String!): RecoveryCodeSet!

  """メールアドレスが確認済みの利用者がフォローする。すでにフォロー済みでも成功する"""
  followUser(handle: String!): FollowState!

  """閲覧のみのロールで招待し、招待のメールを送る"""
  inviteAdmin(email: String!, reason: String): AdminAccount!

  """メールアドレスとパスワードによるログイン"""
  login(input: LoginInput!): LoginResult!

  """この端末のログアウト"""
  logout: Boolean!

  """本人の問い合わせへの追加メッセージ"""
  postInquiryMessage(input: InquiryMessageInput!, inquiryId: ID!): InquiryMessage!

  """下書きの公開。最上位管理者"""
  publishLegalDocument(input: PublishLegalDocumentInput!): AdminLegalDocument!

  """支払いの確定の前の同意の記録。支払える状態の本人の購入だけに記録し、同じ購入の再記録は最新の日時で上書きする"""
  recordCheckoutConsent(purchaseId: ID!): Checkout!

  """リカバリコードの再発行。操作した端末へ新しいセッションを発行する"""
  regenerateAdminRecoveryCodes(reAuthentication: AdminReAuthenticationInput!): AdminRecoveryCodeSet!

  """リカバリコードの再発行"""
  regenerateRecoveryCodes(input: ReAuthenticationInput!): RecoveryCodeSet!

  """利用者の登録"""
  registerUser(input: RegisterUserInput!): Viewer!

  """カテゴリの名前の変更。標準カテゴリは変更できない。モデレーター以上"""
  renameInquiryCategory(id: ID!, name: String!, reason: String): InquiryCategory!

  """ログインの問い合わせへの管理者の返信。対応ステータスを変えない。モデレーター以上"""
  replyToInquiry(body: String!, inquiryId: ID!, reason: String): InquiryReplyResult!

  """メールアドレス変更の要求。重複の有無を問わず同じ結果を返す"""
  requestAdminEmailChange(newEmail: String!, reAuthentication: AdminReAuthenticationInput!): Boolean!

  """パスワードリセットの要求。管理者の有無と状態を問わず同じ結果を返す"""
  requestAdminPasswordReset(email: String!): Boolean!

  """メールアドレス変更の要求"""
  requestEmailChange(input: RequestEmailChangeInput!): Boolean!

  """パスワード変更の要求"""
  requestPasswordChange(input: RequestPasswordChangeInput!): Boolean!

  """パスワードリセットの要求。アカウントの有無を問わず同じ結果を返す"""
  requestPasswordReset(email: String!): Boolean!

  """招待中の管理者へ招待のリンクを送り直す"""
  resendAdminInvitation(id: ID!, reason: String): AdminAccount!

  """確認メールの再送"""
  resendVerificationEmail: ResendVerificationResult!

  """パスワードリセットの確定"""
  resetAdminPassword(
    """設定する新しいパスワード"""
    newPassword: String!
    token: String!
  ): Boolean!

  """パスワードリセットの確定"""
  resetPassword(input: ResetPasswordInput!): Boolean!

  """操作している端末以外のセッションの一括の失効。失効させた件数を返す"""
  revokeOtherSessions: Int!

  """セッションの個別の失効"""
  revokeSession(id: ID!): Boolean!

  """下書きの保存。最上位管理者"""
  saveLegalDocumentDraft(input: SaveLegalDocumentDraftInput!): AdminLegalDocument!

  """招待の完了の1段階目。ニックネームとパスワードを仮に保存し、多要素認証の設定を始める"""
  startAdminInvitation(
    nickname: String!

    """設定するパスワード"""
    password: String!
    token: String!
  ): AdminTotpSetup!

  """多要素認証の再設定の開始。完了まで現在の設定が有効なまま残る"""
  startAdminTotpReset(reAuthentication: AdminReAuthenticationInput!): AdminTotpSetup!

  """疎通確認用の決済の開始。疎通確認を有効にした環境だけで受け付ける"""
  startSmokeCheckout: CheckoutStart!

  """多要素認証の設定の開始"""
  startTotpSetup(input: ReAuthenticationInput!): TotpSetup!

  """Ultrasの加入の開始。加入できるかを確かめて購入を作り、決済画面の経路に使う購入のIDを返す"""
  startUltrasCheckout: CheckoutStart!

  """未ログイン(停止中の利用者を含む)の問い合わせの送信"""
  submitGuestInquiry(input: GuestInquiryInput!): Boolean!

  """停止していないログイン中の利用者の問い合わせの送信"""
  submitMemberInquiry(input: MemberInquiryInput!): MemberInquiry!

  """停止中でない利用者がフォローを解除する。フォローしていなくても成功する"""
  unfollowUser(handle: String!): FollowState!

  """プロフィールの更新。avatarFileIdの省略は画像を取り除く"""
  updateAdminProfile(avatarFileId: ID, id: ID!, nickname: String!, title: String): AdminAccount!

  """メールアドレスが未確認の利用者も保存できる。停止中の利用者は保存できない"""
  updateMyProfile(input: UpdateMyProfileInput!): MyProfile!

  """機能フラグの変更。読み取った版と一致するときだけ保存して監査ログに記録し、変更後の設定を返す。最上位管理者"""
  updateUltrasPromotionSetting(input: UpdateUltrasPromotionSettingInput!): UltrasPromotionSetting!

  """メールアドレスの確認の確定"""
  verifyEmail(token: String!): Boolean!

  """退会"""
  withdraw(input: ReAuthenticationInput!): Boolean!
}

