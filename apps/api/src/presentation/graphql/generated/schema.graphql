input LoginInput {
  email: String!
  password: String!
}

union LoginResult = LoginSucceeded | SecondFactorRequired

"""ログインの完了"""
type LoginSucceeded {
  viewer: Viewer!
}

type Match {
  """実施日(業務日付のYYYY-MM-DD)"""
  date: String!

  """確定の前はnull"""
  decision: MatchDecision

  """マッチ中の即時の終了で確定した"""
  endedEarly: Boolean!
  endsAt: DateTime!

  """側の番号の順"""
  entries: [MatchEntry!]!
  id: ID!
  kind: MatchKind!
  phase: MatchPhase!

  """トーナメントのラウンドの番号(1回戦が1)。予選はnull"""
  round: Int
  stage: MatchStage
  startsAt: DateTime!

  """閲覧者がUpvoteできなければその理由。できればnull"""
  viewerRestriction: UpvoteRestriction

  """閲覧者が有効なUpvoteをしている側。未ログイン・Upvoteなしはnull"""
  viewerUpvotedEntryId: ID
}

"""対戦カードにしない不戦勝のマッチ"""
type MatchBye {
  """勝ち上がる側"""
  entry: MatchEntry!
  match: Match!
  reason: ByeReason!
}

"""
マッチの決着。VOTESはUpvote数、LAST_UPVOTEは同数での最終Upvote時間、NO_VOTESは両者0票の両者敗北、BOTH_FORFEITEDは両方の側の該当による両者敗北
"""
enum MatchDecision {
  BOTH_FORFEITED
  BYE
  LAST_UPVOTE
  NO_VOTES
  VOTES
  WALKOVER
}

type MatchEntry {
  """配色の番号。紐付けを解除した側は0、それ以外はプロダクトのIDで決まる1〜12"""
  colorIndex: Int!
  id: ID!

  """閲覧者自身のプロダクトの側"""
  isViewerOwn: Boolean!

  """表示できなければnull(非公開化・投稿者の退会や停止・論理削除・紐付けの解除)"""
  product: MatchProduct

  """確定の前はnull"""
  result: MatchEntryResult
  upvoteCount: Int!
}

"""側の結果。BYEは対戦相手なしの不戦勝、WALKOVERは相手の該当(退会・停止・非公開化など)による勝利"""
enum MatchEntryResult {
  BYE
  LOST
  WALKOVER
  WON
}

"""マッチの種別"""
enum MatchKind {
  QUALIFIER
  WEEK
  YEAR
}

"""
マッチの状態。照会の時点の時刻から導く。SCHEDULEDは開始前、LIVEはマッチ中、TALLYINGは終了の日時を過ぎて確定の前、FINISHEDは結果の確定の後
"""
enum MatchPhase {
  FINISHED
  LIVE
  SCHEDULED
  TALLYING
}

"""マッチの側のプロダクト"""
type MatchProduct {
  category: ProductCategory!
  handle: String!

  """掲載済み(可視かつ予選で勝利したローンチがある)"""
  listed: Boolean!

  """画像の記録が無ければnull。隔離中の画像は枠だけを返し、objectKeyが空になる"""
  logo: MediaImage
  name: String!
  tagline: String!
  websiteUrl: String!
}

"""トーナメントの段階。予選と段階の名前を持たないラウンドはnull"""
enum MatchStage {
  FINAL
  QUARTERFINAL
  SEMIFINAL
}

"""ファイル用の用途のファイル"""
