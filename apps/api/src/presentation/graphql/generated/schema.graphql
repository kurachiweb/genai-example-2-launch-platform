"""利用者の状態"""
enum AccountStatus {
  ACTIVE
  SUSPENDED
}

"""管理者のアカウント"""
type AdminAccount {
  """未登録・表示できない画像ではnull"""
  avatar: MediaImage
  createdAt: DateTime!
  email: String!
  id: ID!

  """招待の完了前はnull"""
  nickname: String
  role: AdminRole!
  status: AdminAccountStatus!
  title: String
}

"""管理者の一覧に示す状態"""
enum AdminAccountStatus {
  ACTIVE
  INVITATION_EXPIRED
  INVITED
}

"""メールのリンクによる確定の結果"""
type AdminConfirmationResult {
  """確定の操作をした端末が同じ管理者としてログイン中なら、入れ替えた後の管理者"""
  viewer: AdminViewer
}

"""管理画面の編集の対象の法務文書"""
type AdminLegalDocument {
  """下書きが無ければnull"""
  draft: AdminLegalDraft
  kind: LegalDocumentKind!

  """未公開ならnull"""
  latestBody: String

  """新しい順"""
  revisions: [AdminLegalRevision!]!

  """保存・破棄・公開で送り返す状態の版"""
  stateVersion: Int!
}

"""管理画面の法務文書の一覧の1行"""
type AdminLegalDocumentSummary {
  hasDraft: Boolean!
  kind: LegalDocumentKind!

  """未公開ならnull"""
  latestPublishedAt: DateTime

  """未公開ならnull"""
  latestVersionNumber: Int
}

"""管理画面で表示する版"""
type AdminLegalDocumentVersion {
  body: String!
  changeSummary: String!
  isLatest: Boolean!
  kind: LegalDocumentKind!
  publishedAt: DateTime!
  publishedBy: LegalDocumentEditor!
  versionNumber: Int!
}

"""保存済みの下書き"""
type AdminLegalDraft {
  body: String!
  savedAt: DateTime!
  savedBy: LegalDocumentEditor!
}

"""管理画面の改訂履歴の1版"""
type AdminLegalRevision {
  changeSummary: String!
  publishedAt: DateTime!
  publishedBy: LegalDocumentEditor!
  versionNumber: Int!
}

"""重要な操作の本人確認"""
input AdminReAuthenticationInput {
  """本人確認に使う現在のパスワード"""
  currentPassword: String!
  secondFactor: AdminSecondFactorInput!
}

"""この応答でだけ見せるリカバリコード"""
type AdminRecoveryCodeSet {
  codes: [String!]!
}

"""管理者のロール"""
enum AdminRole {
  MODERATOR
  SUPER_ADMIN
  VIEWER
}

"""認証コードかリカバリコードのどちらか一方"""
input AdminSecondFactorInput {
  recoveryCode: String
  totpCode: String
}

"""第2要素の入力の待ち"""
type AdminSecondFactorRequired {
  """第2要素の段階の要求と組にする値"""
  challenge: String!
  expiresAt: DateTime!
}

"""認証アプリへ登録する多要素認証の設定"""
type AdminTotpSetup {
  expiresAt: DateTime!
  otpauthUri: String!

  """認証アプリへ手入力するためのbase32"""
  secret: String!
}

"""ログイン中の管理者"""
type AdminViewer {
  """未登録・表示できない画像ではnull"""
  avatar: MediaImage
  email: String!
  id: ID!
  nickname: String!

  """要求されたときだけ数える"""
  remainingRecoveryCodes: Int!
  role: AdminRole!
  title: String
}

"""監査ログの詳細の1項目"""
type AuditDetail {
  key: String!
  value: String!
}

"""監査ログの1件"""
type AuditLogEntry {
  action: String!

  """操作種別の表示名"""
  actionLabel: String!
  detail: [AuditDetail!]!
  id: ID!
  occurredAt: DateTime!
  operator: AuditOperator!
  reason: String
  targetIds: [String!]!

  """対象を取らない操作ではnull"""
  targetKind: String
}

"""監査ログの絞り込みの条件。指定した条件をすべて満たすものだけを返す"""
input AuditLogFilterInput {
  action: String

  """この日時を含まない"""
  occurredBefore: DateTime

  """この日時を含む"""
  occurredFrom: DateTime
  operatorId: ID
  targetId: String
}

"""監査ログの1ページ(日時の新しい順に50件まで)"""
type AuditLogPage {
  entries: [AuditLogEntry!]!

  """続きが無ければnull"""
  nextCursor: String
}

"""監査ログを記録した操作者"""
type AuditOperator {
  id: ID!

  """削除済みの管理者ではnull"""
  nickname: String
}

input CompleteSecondFactorLoginInput {
  challenge: String!
  secondFactor: SecondFactorInput!
}

"""メールのリンクによる確定の結果"""
type ConfirmationResult {
  """確定の操作をした端末が同じ利用者としてログイン中なら、入れ替えた後の利用者"""
  viewer: Viewer
}

"""UTCのRFC 3339形式の日時"""
scalar DateTime

"""下書きの破棄"""
input DiscardLegalDocumentDraftInput {
  expectedStateVersion: Int!
  kind: LegalDocumentKind!
}

"""利用者側に公開する法務文書"""
type LegalDocument {
  kind: LegalDocumentKind!

  """準備中ならnull"""
  latest: LegalDocumentVersion

  """新しい順"""
  revisions: [LegalRevision!]!
}

"""版を公開した・下書きを保存した管理者"""
type LegalDocumentEditor {
  id: ID!

  """削除済みの管理者ではnull"""
  nickname: String
}

"""法務文書の種類"""
enum LegalDocumentKind {
  LEGAL_NOTICE
  PRIVACY
  TERMS
}

"""公開した版"""
type LegalDocumentVersion {
  body: String!
  changeSummary: String!
  isLatest: Boolean!
  kind: LegalDocumentKind!
  publishedAt: DateTime!
  versionNumber: Int!
}

"""改訂履歴の1版"""
type LegalRevision {
  changeSummary: String!
  publishedAt: DateTime!
  versionNumber: Int!
}

input LoginInput {
  email: String!
  password: String!
}

union LoginResult = LoginSucceeded | SecondFactorRequired

"""ログインの完了"""
type LoginSucceeded {
  viewer: Viewer!
}

"""ファイル用の用途のファイル"""
type MediaAttachment {
  byteSize: Int!
  contentType: String!

  """フロントエンドサーバーのダウンロードのパス"""
  downloadPath: String!
  id: ID!
  originalFileName: String!
}

"""画像用の用途のファイル"""
type MediaImage {
  fallbackFormat: MediaImageFallbackFormat!
  height: Int
  id: ID!

  """隔離中・削除待ち・保存未完了の画像は空"""
  objectKey: String
  width: Int
}

"""
AVIF・WebPに非対応のブラウザ向けの形式。原本がJPEGならJPG、SVGならSVG(SVGはこの形式だけで表示する)、それ以外はPNG
"""
enum MediaImageFallbackFormat {
  JPG
  PNG
  SVG
}

type Mutation {
  """メールアドレスとパスワードによるログイン。有効な管理者には必ず第2要素を求める"""
  adminLogin(
    email: String!

    """照合するパスワード"""
    password: String!
  ): AdminSecondFactorRequired!

  """この端末のログアウト"""
  adminLogout: Boolean!

  """パスワードの変更。操作した端末へ新しいセッションを発行する"""
  changeAdminPassword(
    """設定する新しいパスワード"""
    newPassword: String!
    reAuthentication: AdminReAuthenticationInput!
  ): Boolean!

  """ロールの変更"""
  changeAdminRole(id: ID!, reason: String, role: AdminRole!): AdminAccount!

  """招待の完了の2段階目。認証コードで有効化し、ログインする"""
  completeAdminInvitation(token: String!, totpCode: String!): AdminRecoveryCodeSet!

  """認証コードかリカバリコードによるログインの完了"""
  completeAdminSecondFactorLogin(challenge: String!, secondFactor: AdminSecondFactorInput!): AdminViewer!

  """多要素認証の再設定の完了。操作した端末へ新しいセッションを発行する"""
  completeAdminTotpReset(totpCode: String!): AdminRecoveryCodeSet!

  """認証コードかリカバリコードによるログインの完了"""
  completeSecondFactorLogin(input: CompleteSecondFactorLoginInput!): Viewer!

  """メールアドレス変更の確定"""
  confirmAdminEmailChange(token: String!): AdminConfirmationResult!

  """メールアドレス変更の確定"""
  confirmEmailChange(token: String!): ConfirmationResult!

  """パスワード変更の確定"""
  confirmPasswordChange(token: String!): ConfirmationResult!

  """管理者の削除"""
  deleteAdmin(id: ID!, reason: String): Boolean!

  """多要素認証の無効化"""
  disableTotp(input: ReAuthenticationInput!): Boolean!

  """多要素認証の有効化"""
  enableTotp(totpCode: String!): RecoveryCodeSet!

  """閲覧のみのロールで招待し、招待のメールを送る"""
  inviteAdmin(email: String!, reason: String): AdminAccount!

  """メールアドレスとパスワードによるログイン"""
  login(input: LoginInput!): LoginResult!

  """この端末のログアウト"""
  logout: Boolean!

  """リカバリコードの再発行。操作した端末へ新しいセッションを発行する"""
  regenerateAdminRecoveryCodes(reAuthentication: AdminReAuthenticationInput!): AdminRecoveryCodeSet!

  """リカバリコードの再発行"""
  regenerateRecoveryCodes(input: ReAuthenticationInput!): RecoveryCodeSet!

  """利用者の登録"""
  registerUser(input: RegisterUserInput!): Viewer!

  """メールアドレス変更の要求。重複の有無を問わず同じ結果を返す"""
  requestAdminEmailChange(newEmail: String!, reAuthentication: AdminReAuthenticationInput!): Boolean!

  """パスワードリセットの要求。管理者の有無と状態を問わず同じ結果を返す"""
  requestAdminPasswordReset(email: String!): Boolean!

  """メールアドレス変更の要求"""
  requestEmailChange(input: RequestEmailChangeInput!): Boolean!

  """パスワード変更の要求"""
  requestPasswordChange(input: RequestPasswordChangeInput!): Boolean!

  """パスワードリセットの要求。アカウントの有無を問わず同じ結果を返す"""
  requestPasswordReset(email: String!): Boolean!

  """招待中の管理者へ招待のリンクを送り直す"""
  resendAdminInvitation(id: ID!, reason: String): AdminAccount!

  """確認メールの再送"""
  resendVerificationEmail: ResendVerificationResult!

  """パスワードリセットの確定"""
  resetAdminPassword(
    """設定する新しいパスワード"""
    newPassword: String!
    token: String!
  ): Boolean!

  """パスワードリセットの確定"""
  resetPassword(input: ResetPasswordInput!): Boolean!

  """操作している端末以外のセッションの一括の失効。失効させた件数を返す"""
  revokeOtherSessions: Int!

  """セッションの個別の失効"""
  revokeSession(id: ID!): Boolean!

  """招待の完了の1段階目。ニックネームとパスワードを仮に保存し、多要素認証の設定を始める"""
  startAdminInvitation(
    nickname: String!

    """設定するパスワード"""
    password: String!
    token: String!
  ): AdminTotpSetup!

  """多要素認証の再設定の開始。完了まで現在の設定が有効なまま残る"""
  startAdminTotpReset(reAuthentication: AdminReAuthenticationInput!): AdminTotpSetup!

  """多要素認証の設定の開始"""
  startTotpSetup(input: ReAuthenticationInput!): TotpSetup!

  """プロフィールの更新。avatarFileIdの省略は画像を取り除く"""
  updateAdminProfile(avatarFileId: ID, id: ID!, nickname: String!, title: String): AdminAccount!

  """メールアドレスの確認の確定"""
  verifyEmail(token: String!): Boolean!

  """退会"""
  withdraw(input: ReAuthenticationInput!): Boolean!
}

type OffsetPageInfo {
  page: Int!
  perPage: Int!
  totalCount: Int!
  totalPages: Int!
}

type PageInfo {
  endCursor: String
  hasNextPage: Boolean!
}

"""下書きの公開"""
input PublishLegalDocumentInput {
  changeSummary: String!
  expectedStateVersion: Int!
  kind: LegalDocumentKind!
}

type Query {
  """招待中を含む全管理者を登録の新しい順に返す"""
  adminAccounts: [AdminAccount!]!

  """ログイン中の管理者。未ログイン・無効なセッションではnull"""
  adminViewer: AdminViewer

  """監査ログの検索。変更・削除の操作は無い"""
  auditLogs(after: String, filter: AuditLogFilterInput): AuditLogPage!

  """法務文書の最新版と改訂履歴"""
  legalDocument(kind: LegalDocumentKind!): LegalDocument!

  """法務文書の指定した版。存在しない版はnull"""
  legalDocumentVersion(kind: LegalDocumentKind!, versionNumber: Int!): LegalDocumentVersion

  """ログイン中の端末の一覧"""
  mySessions: [UserSessionSummary!]!

  """APIサーバーの時刻とデータベースへの到達可否"""
  systemStatus: SystemStatus!

  """ログイン中の利用者。未ログイン・無効なセッションではnull"""
  viewer: Viewer
}

"""重要な操作の本人確認"""
input ReAuthenticationInput {
  currentPassword: String!

  """多要素認証が有効なときだけ必要"""
  secondFactor: SecondFactorInput
}

"""この応答でだけ見せるリカバリコード"""
type RecoveryCodeSet {
  codes: [String!]!
}

input RegisterUserInput {
  """利用規約とプライバシーポリシー(18歳以上であることの表明を含む)への同意"""
  agreedToTerms: Boolean!
  email: String!
  nickname: String!
  password: String!
}

input RequestEmailChangeInput {
  newEmail: String!
  reAuthentication: ReAuthenticationInput!
}

input RequestPasswordChangeInput {
  newPassword: String!
  reAuthentication: ReAuthenticationInput!
}

"""確認メールの再送の結果"""
enum ResendVerificationResult {
  ALREADY_VERIFIED
  SENT
}

input ResetPasswordInput {
  newPassword: String!
  token: String!
}

"""下書きの保存"""
input SaveLegalDocumentDraftInput {
  body: String!
  expectedStateVersion: Int!
  kind: LegalDocumentKind!
}

"""認証コードかリカバリコードのどちらか一方"""
input SecondFactorInput {
  recoveryCode: String
  totpCode: String
}

"""第2要素の入力の待ち"""
type SecondFactorRequired {
  """第2要素の段階の要求と組にする値"""
  challenge: String!
  expiresAt: DateTime!
}

type SystemStatus {
  databaseReachable: Boolean!
  serverTime: DateTime!
}

"""認証アプリへ登録する多要素認証の設定"""
type TotpSetup {
  expiresAt: DateTime!
  otpauthUri: String!

  """認証アプリへ手入力するためのbase32"""
  secret: String!
}

"""ログイン中の端末"""
type UserSessionSummary {
  browserName: String
  createdAt: DateTime!

  """操作している端末"""
  current: Boolean!
  id: ID!
  lastUsedAt: DateTime!
  osName: String
}

"""ログイン中の利用者"""
type Viewer {
  email: String!
  emailVerified: Boolean!
  handle: String!
  id: ID!
  nickname: String!

  """要求されたときだけ数える。多要素認証が無効なら0"""
  remainingRecoveryCodes: Int!
  status: AccountStatus!
  totpEnabled: Boolean!
}
