# 本番ランタイムはCloudflare Workersのため、本composeはローカル開発専用である
name: genai-ex-2-launch

services:
  root:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /workspace
    volumes:
      - .:/workspace
      - ./apps/db:/workspace/apps/api/db
      - ./apps/db:/workspace/apps/public-api/db
      - ./apps/backend-lib:/workspace/apps/api/lib
      - ./apps/backend-lib:/workspace/apps/public-api/lib
      - ./apps/frontend-lib:/workspace/apps/client/lib
      - ./apps/frontend-lib:/workspace/apps/admin/lib
      # node_modulesはホストと混ぜず、名前付きボリュームでコンテナ側に隔離する
      # `apps/backend-lib`ディレクトリ内にBunプロジェクトは作らないため、`node_modules_backend_lib`は不要である
      - node_modules_root:/workspace/node_modules
      - node_modules_api:/workspace/apps/api/node_modules
      - node_modules_public_api:/workspace/apps/public-api/node_modules
      - node_modules_db:/workspace/apps/db/node_modules
      - node_modules_db:/workspace/apps/api/db/node_modules
      - node_modules_db:/workspace/apps/public-api/db/node_modules
      - node_modules_client:/workspace/apps/client/node_modules
      - node_modules_admin:/workspace/apps/admin/node_modules
      - node_modules_frontend_lib:/workspace/apps/frontend-lib/node_modules
      - node_modules_frontend_lib:/workspace/apps/client/lib/node_modules
      - node_modules_frontend_lib:/workspace/apps/admin/lib/node_modules
      # Claude、Infisical、Cloudflareのログイン情報を永続化し、コンテナ再作成時の再認証を不要にする
      - config_claude:/home/bun/.claude
      - config_infisical:/home/bun/.infisical
      - config_wrangler:/home/bun/.wrangler
      # Bunのグローバルインストールキャッシュを永続化し、コンテナ再作成時のMCPパッケージ再ダウンロードを不要にする
      - config_bun:/home/bun/.bun
      # Playwright・chrome-devtools MCPが導入するChromiumを永続化し、コンテナ再作成時の再ダウンロードを不要にする
      - playwright_browsers:/opt/ms-playwright
    restart: unless-stopped
    init: true
    shm_size: "1gb"
    ports:
      - "127.0.0.1:48041:48041" # ローカルでのメール確認UI、メール本文内のトークンを同一LAN内のデバイスに見せない
      - "48042:48042" # 内部APIサーバー
      - "48043:48043" # 公開APIサーバー
      - "48044:48044" # 利用者側フロントエンド
      - "48045:48045" # 管理者側フロントエンド
      - "48046:48046" # Storybookコンポーネントカタログ
    environment:
      NODE_ENV: development
      API_GRAPHQL_URL: http://localhost:48042/graphql
      WRANGLER_SEND_METRICS: "false"
      MP_MAX_MESSAGES: "5000"
      MP_DATABASE: /workspace/apps/email/mailpit.db

volumes:
  node_modules_root:
  node_modules_api:
  node_modules_public_api:
  node_modules_db:
  node_modules_client:
  node_modules_admin:
  node_modules_frontend_lib:
  config_claude:
  config_infisical:
  config_wrangler:
  config_bun:
  playwright_browsers:
